name: Daily Vault Update

on:
  schedule:
    - cron: "0 9 * * *" # every day at 09:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the campaign window in scripts/daily-config.json"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-vault-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate today's components
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional: enables the Claude engine
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          VAULT_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: node scripts/generate-daily-components.mjs

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/data/prompts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify previews and production build
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run check:previews
          npm run build

      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "vault-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/prompts.json
          git commit -m "feat(vault): add daily animated components"
          git push origin HEAD:main

      # Vercel's Git integration redeploys automatically on the push above.
      # If you deploy without the Git integration, add a Deploy Hook URL as the VERCEL_DEPLOY_HOOK secret.
      - name: Ping Vercel deploy hook (optional)
        if: steps.diff.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
